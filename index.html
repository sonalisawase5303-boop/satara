<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satara GIS Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background: #1e293b;
            color: #fff;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
        }

        .header {
            padding: 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .header h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .content {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 15px 0 8px 0;
            letter-spacing: 1px;
        }

        .layer-group {
            background: #334155;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #475569;
        }

        .layer-item:last-child {
            border-bottom: none;
        }

        .layer-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
        }

        /* Statistics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: #334155;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .stat-card p {
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        /* Map Container */
        #map {
            flex: 1;
            height: 100vh;
        }

        /* Toggle Checkbox Switch */
        input[type="checkbox"] {
            accent-color: #38bdf8;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar Container -->
    <div id="sidebar">
        <div class="header">
            <h2><i class="fa-solid fa-map-location-dot"></i> Satara GIS Portal</h2>
            <p>Satara District Interactive Dashboard</p>
        </div>

        <div class="content">
            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search Taluka / Location...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <!-- Dashboard Quick Stats -->
            <div class="section-title">Overview</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="area-stat">10,480</h3>
                    <p>Total Area (sq km)</p>
                </div>
                <div class="stat-card">
                    <h3 id="taluka-stat">11</h3>
                    <p>Talukas Covered</p>
                </div>
            </div>

            <!-- GIS Layers Selection -->
            <div class="section-title">GIS Layers</div>
            <div class="layer-group">
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-road" checked onchange="toggleLayer('road')">
                        <span class="color-box" style="background: #ef4444;"></span>
                        Road Network
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-railway" checked onchange="toggleLayer('railway')">
                        <span class="color-box" style="background: #eab308;"></span>
                        Railway Lines
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-water" checked onchange="toggleLayer('water')">
                        <span class="color-box" style="background: #06b6d4;"></span>
                        Water Bodies
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-building" checked onchange="toggleLayer('building')">
                        <span class="color-box" style="background: #a855f7;"></span>
                        Buildings / Urban
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-landuse" checked onchange="toggleLayer('landuse')">
                        <span class="color-box" style="background: #22c55e;"></span>
                        Land Use
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="checkbox" id="layer-boundary" checked onchange="toggleLayer('boundary')">
                        <span class="color-box" style="background: #f97316;"></span>
                        Satara Boundary (satara_b)
                    </label>
                </div>
            </div>

            <!-- Basemap Selector -->
            <div class="section-title">Base Maps</div>
            <div class="layer-group">
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="radio" name="basemap" value="satellite" checked onclick="changeBasemap('satellite')">
                        Google Satellite
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="radio" name="basemap" value="terrain" onclick="changeBasemap('terrain')">
                        Google Terrain
                    </label>
                </div>
                <div class="layer-item">
                    <label class="layer-label">
                        <input type="radio" name="basemap" value="osm" onclick="changeBasemap('osm')">
                        OpenStreetMap
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map centered on Satara, Maharashtra
        const sataraCoords = [17.6805, 74.0183];
        const map = L.map('map', {
            center: sataraCoords,
            zoom: 10,
            zoomControl: false
        });

        // Add Zoom Control to Top Right
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Define Base Layers
        const basemaps = {
            satellite: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps'
            }),
            terrain: L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps'
            }),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            })
        };

        // Set Default Basemap
        let activeBasemap = basemaps.satellite.addTo(map);

        function changeBasemap(type) {
            map.removeLayer(activeBasemap);
            activeBasemap = basemaps[type];
            activeBasemap.addTo(map);
        }

        // 3. Define Vector Overlay Layers (Sample GIS Data)
        const layers = {};

        // Satara Boundary (satara_b)
        layers['boundary'] = L.polygon([
            [17.95, 73.65], [18.10, 74.20], [17.80, 74.55], 
            [17.35, 74.30], [17.40, 73.75]
        ], {
            color: '#f97316',
            weight: 3,
            fillOpacity: 0.15,
            dashArray: '5, 5'
        }).bindPopup("<b>Satara District Boundary</b>");

        // Road Layer
        layers['road'] = L.polyline([
            [[17.68, 74.01], [17.85, 74.15], [18.00, 74.20]], // NH 48 North
            [[17.68, 74.01], [17.40, 74.10]],                 // NH 48 South
            [[17.68, 74.01], [17.91, 73.66]]                  // Towards Mahabaleshwar
        ], {
            color: '#ef4444',
            weight: 4
        }).bindPopup("<b>Major Highway Network</b>");

        // Railway Layer
        layers['railway'] = L.polyline([
            [[17.68, 74.01], [17.72, 74.20], [17.80, 74.35]]
        ], {
            color: '#eab308',
            weight: 3,
            dashArray: '8, 8'
        }).bindPopup("<b>Railway Track</b>");

        // Water Bodies Layer (Koyna / Krishna river representation)
        layers['water'] = L.polygon([
            [17.40, 73.70], [17.50, 73.75], [17.60, 73.72], [17.55, 73.65]
        ], {
            color: '#06b6d4',
            fillColor: '#06b6d4',
            fillOpacity: 0.6
        }).bindPopup("<b>Koyna Reservoir / Water Body</b>");

        // Land Use Layer
        layers['landuse'] = L.polygon([
            [17.80, 73.80], [17.92, 73.70], [17.88, 73.85]
        ], {
            color: '#22c55e',
            fillColor: '#22c55e',
            fillOpacity: 0.4
        }).bindPopup("<b>Forest / Agricultural Land Use</b>");

        // Buildings Layer
        layers['building'] = L.polygon([
            [17.685, 74.012], [17.690, 74.018], [17.680, 74.025]
        ], {
            color: '#a855f7',
            fillColor: '#a855f7',
            fillOpacity: 0.7
        }).bindPopup("<b>Satara Urban Settlement</b>");

        // Add All Layers to Map Initially
        Object.keys(layers).forEach(key => {
            layers[key].addTo(map);
        });

        // Toggle Layer Visibility
        function toggleLayer(layerName) {
            const isChecked = document.getElementById(`layer-${layerName}`).checked;
            if (isChecked) {
                map.addLayer(layers[layerName]);
            } else {
                map.removeLayer(layers[layerName]);
            }
        }

        // Search Location Functionality
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const query = this.value.toLowerCase();
                if (query.includes('mahabaleshwar')) {
                    map.flyTo([17.9237, 73.6586], 12);
                } else if (query.includes('karad')) {
                    map.flyTo([17.2882, 74.1842], 12);
                } else if (query.includes('wai')) {
                    map.flyTo([17.9482, 73.8943], 12);
                } else {
                    map.flyTo(sataraCoords, 11);
                }
            }
        });
    </script>
</body>
</html>
